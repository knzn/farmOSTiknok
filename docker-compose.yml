version: '3.9'

# MongoDB = Atlas (cloud) even in local dev
# Set MONGODB_URI=mongodb+srv://... in apps/api/.env

services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./apps/api/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
      - ./packages:/app/packages
    command: pnpm --filter @app/api dev
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - ./services/worker/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/worker:/app/services/worker
      - /app/services/worker/node_modules

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./services/ai/.env
    volumes:
      - ./services/ai:/app

volumes:
  redis_data:
